<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Krea Food Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="krea-logo">KREA</div>

        <h1>Campus Food</h1>
        <p>Sign in using simulated Krea SSO</p>

        <form id="loginForm">
            <label>Krea ID</label>
            <input id="kreaId" placeholder="student123" required>

            <label>Name</label>
            <input id="name" placeholder="Your name" required>

            <button type="submit">Continue with Krea SSO</button>
        </form>

        <p id="loginMessage"></p>
    </main>

    <script src="login.js"></script>
</body>
</html>
