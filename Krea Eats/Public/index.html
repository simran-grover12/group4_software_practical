<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krea Food Ordering</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-layout">

    <aside id="sidebar" class="sidebar">
        <div class="brand">
            <span class="brand-mark">K</span>
            <span class="brand-text">Krea Food</span>
        </div>

        <button id="collapseSidebar" class="collapse-button">
            ☰
        </button>

        <nav>
            <button class="nav-item active" data-page="dashboard">
                <span>🏠</span>
                <b>Dashboard</b>
            </button>

            <button class="nav-item" data-page="cart">
                <span>🛒</span>
                <b>My Cart</b>
                <small id="cartCount">0</small>
            </button>

            <button class="nav-item" data-page="orders">
                <span>📦</span>
                <b>My Orders</b>
            </button>

            <button class="nav-item" data-page="notifications">
                <span>🔔</span>
                <b>Notifications</b>
            </button>

            <button class="nav-item" data-page="favorites">
                <span>❤️</span>
                <b>Favorites</b>
            </button>

            <button class="nav-item" data-page="feedback">
                <span>💬</span>
                <b>Feedback</b>
            </button>

            <button id="logoutButton" class="nav-item logout">
                <span>🚪</span>
                <b>Logout</b>
            </button>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="eyebrow">KREA UNIVERSITY</p>
                <h1 id="pageTitle">Good afternoon</h1>
            </div>

            <div class="profile">
                <span id="userName"></span>
                <div class="avatar">ST</div>
            </div>
        </header>

        <section id="dashboardPage">
            <div class="hero-banner">
                <div>
                    <p class="eyebrow">CAMPUS DINING</p>
                    <h2>What are you craving today?</h2>
                    <p>Order from your favourite Krea outlets.</p>
                </div>

                <div class="hero-icon">🍽️</div>
            </div>

            <div class="section-heading">
                <div>
                    <p class="eyebrow">EXPLORE</p>
                    <h2>Campus outlets</h2>
                </div>
                <span>Drag cards to rearrange</span>
            </div>

            <div id="outletGrid" class="outlet-grid"></div>
        </section>

        <section id="menuPage" class="hidden">
            <button id="backToDashboard" class="back-button">
                ← Back to outlets
            </button>

            <div class="section-heading">
                <div>
                    <p class="eyebrow">MENU</p>
                    <h2 id="outletTitle"></h2>
                </div>

                <select id="dietFilter">
                    <option value="all">All items</option>
                    <option value="veg">Vegetarian</option>
                    <option value="non-veg">Non-vegetarian</option>
                </select>
            </div>

            <div id="menuList"></div>
        </section>

        <section id="cartPage" class="hidden">
            <div class="section-heading">
                <h2>My Cart</h2>
            </div>
            <div id="cartList"></div>
            <button id="placeOrderButton" class="primary-button">
                Place order
            </button>
        </section>

        <section id="ordersPage" class="hidden">
            <div class="section-heading">
                <h2>My Orders</h2>
            </div>
            <div id="ordersList"></div>
        </section>

        <section id="notificationsPage" class="hidden">
            <div class="section-heading">
                <h2>Notifications</h2>
            </div>
            <div id="notificationsList"></div>
        </section>
    </main>
</div>

<div id="cartPopup" class="cart-popup hidden">
    <span id="popupText">Item added to cart</span>
    <button onclick="showPage('cart')">View cart</button>
</div>

<script src="app.js"></script>
</body>
</html>
